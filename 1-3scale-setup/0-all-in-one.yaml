---
# ==============================================================================
# 1. DATABASE PERSISTENT VOLUME CLAIMS (3 RWO)
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: 3scale
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: system-redis-pvc
  namespace: 3scale
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-redis-pvc
  namespace: 3scale
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# ==============================================================================
# 2. IN-CLUSTER SYSTEM DATABASE: MYSQL 8.0 (Deployment + Service)
# ==============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 3scale-postgres
  namespace: 3scale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15:latest
          env:
            - name: POSTGRESQL_USER
              value: system
            - name: POSTGRESQL_PASSWORD
              value: password123
            - name: POSTGRESQL_DATABASE
              value: system_db
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: 3scale
spec:
  ports:
    - port: 5432
  selector:
    app: postgres            

           
---
# ==============================================================================
# 3. IN-CLUSTER SYSTEM REDIS (Deployment + Service)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-redis-inst
  namespace: 3scale
  labels:
    app: system-redis-inst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: system-redis-inst
  template:
    metadata:
      labels:
        app: system-redis-inst
    spec:
      containers:
        - name: redis
          image: registry.redhat.io/rhel9/redis-7:latest
          env:
            - name: REDIS_PASSWORD
              value: "password123"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /var/lib/redis/data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: system-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: system-redis-inst
  namespace: 3scale
  labels:
    app: system-redis-inst
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app: system-redis-inst

---
# ==============================================================================
# 4. IN-CLUSTER BACKEND REDIS (Deployment + Service)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-redis-inst
  namespace: 3scale
  labels:
    app: backend-redis-inst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-redis-inst
  template:
    metadata:
      labels:
        app: backend-redis-inst
    spec:
      containers:
        - name: redis
          image: registry.redhat.io/rhel9/redis-7:latest
          env:
            - name: REDIS_PASSWORD
              value: "password123"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /var/lib/redis/data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: backend-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-redis-inst
  namespace: 3scale
  labels:
    app: backend-redis-inst
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app: backend-redis-inst

---
# ==============================================================================
# 5. WATCHED CONNECTION SECRETS & PRE-SEEDED PLATFORM TOKENS
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: system-database
  namespace: 3scale
stringData:
  # Connection string for PostgreSQL matching the service name and environment credentials
  URL: "postgresql://system:password123@postgres-svc.3scale.svc.cluster.local:5432/system_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: system-redis
  namespace: 3scale
type: Opaque
stringData:
  URL: "redis://:password123@system-redis-inst.3scale.svc:6379/1"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-redis
  namespace: 3scale
type: Opaque
stringData:
  REDIS_STORAGE_URL: "redis://:password123@backend-redis-inst.3scale.svc:6379/0"
  REDIS_QUEUES_URL: "redis://:password123@backend-redis-inst.3scale.svc:6379/1"
  CONFIG_REDIS_STORAGE_URL: "redis://:password123@backend-redis-inst.3scale.svc:6379/0"
  CONFIG_REDIS_QUEUES_URL: "redis://:password123@backend-redis-inst.3scale.svc:6379/1"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-internal-api
  namespace: 3scale
type: Opaque
stringData:
  token: "backend-token-preseed-secret-12345"
---
apiVersion: v1
kind: Secret
metadata:
  name: system-events-hook
  namespace: 3scale
type: Opaque
stringData:
  URL: "http://system-provider:3000"
  PASSWORD: "systemhookpassword123"

---

