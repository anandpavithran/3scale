apiVersion: v1
kind: Service
metadata:
  name: mailserver-svc
  namespace: dev-mailserver
  labels:
    app: mailserver
spec:
  type: ClusterIP
  ports:
  - name: smtp
    port: 1025
    targetPort: 1025
    protocol: TCP
  - name: http-ui
    port: 8025
    targetPort: 8025
    protocol: TCP
  selector:
    app: mailserver
