apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: 3scale 
spec:
  ingress:
    enabled: "True"
  config:
    log:
      mode: "console"
      level: "warn"
    auth:
      disable_login_form: "False"
      disable_signout_menu: "True"
    auth.anonymous:
      enabled: "True"
      org_role: "Admin"
  dashboardLabelSelector:
  - matchExpressions:
    - key: app
      operator: In
      values:
      - 3scale-api-management
