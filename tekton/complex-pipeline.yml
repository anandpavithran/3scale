apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: github-build-deploy-pipeline
  namespace: tekton-build
spec:
  params:
    - name: git-url
      type: string
      default: "https://github.com/anandpavithran/3scale"
    - name: git-revision
      type: string
      default: "main"
    - name: context-dir
      type: string
      default: "GE1-2"
    - name: image-name
      type: string
      default: "quay.io/anandpavithran/sampleapp:1.0"
    - name: target-project
      type: string
      default: "test100"
  workspaces:
    - name: shared-source
  tasks:
    # Task 1: Dynamically resolved git-clone from Tekton Hub
    - name: clone-source
      taskRef:
        resolver: hub
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: version
            value: "" # Optional: specify version, or omit for latest
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: shared-source

    # Task 2: Dynamically resolved buildah from Tekton Hub
    - name: build-and-push
      runAfter:
        - clone-source
      taskRef:
        resolver: hub
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: version
            value: ""
      params:
        - name: IMAGE
          value: $(params.image-name)
        - name: CONTEXT
          value: $(params.context-dir)
        - name: TLSVERIFY
          value: "true"
      workspaces:
        - name: source
          workspace: shared-source

    # Task 3: Local deploy task
    - name: deploy-app
      runAfter:
        - build-and-push
      taskRef:
        name: deploy-to-openshift
      params:
        - name: image
          value: $(params.image-name)
        - name: targetNamespace
          value: $(params.target-project)
        - name: appName
          value: "sampleapp"
